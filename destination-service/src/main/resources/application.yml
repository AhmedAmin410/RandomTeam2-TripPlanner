spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://destination-postgres:5432/tripdb-destinations}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/tripplanningmongo?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}
  cache:
    type: redis
    redis:
      time-to-live: 300000
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_YOUR_44_CHAR_KEY}
  expiration: ${JWT_EXPIRATION_MS:86400000}

feign:
  itinerary-service:
    url: ${FEIGN_ITINERARY_SERVICE_URL:http://localhost:8083}
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://localhost:8081}
  destination-service:
    url: ${FEIGN_DESTINATION_SERVICE_URL:http://localhost:8082}
  booking-service:
    url: ${FEIGN_BOOKING_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
