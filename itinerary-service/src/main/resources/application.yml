spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripplanningdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/tripplanningmongo?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}
    neo4j:
      uri: ${SPRING_DATA_NEO4J_URI:bolt://localhost:7687}
      username: ${SPRING_DATA_NEO4J_USERNAME:neo4j}
      password: ${SPRING_DATA_NEO4J_PASSWORD:neo4jpass}
  cache:
    type: redis
    redis:
      time-to-live: 600000

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3VyZSByYW5kb20ga2V5IGZvciBqd3Q=}
  expiration: ${JWT_EXPIRATION_MS:86400000}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

feign:
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://localhost:8081}
  destination-service:
    url: ${FEIGN_DESTINATION_SERVICE_URL:http://localhost:8082}
  booking-service:
    url: ${FEIGN_BOOKING_SERVICE_URL:http://localhost:8085}