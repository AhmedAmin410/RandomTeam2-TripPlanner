apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
  namespace: tripplanning
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - user-service:8080
            labels:
              service: user-service
              milestone: s1

      - job_name: booking-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - booking-service:8080
            labels:
              service: booking-service
              milestone: m3
