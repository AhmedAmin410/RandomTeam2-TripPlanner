apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - user-service.tripplanning.svc.cluster.local:8080
            labels:
              service: user-service

      - job_name: destination-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - destination-service.tripplanning.svc.cluster.local:8080
            labels:
              service: destination-service

      - job_name: itinerary-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - itinerary-service.tripplanning.svc.cluster.local:8080
            labels:
              service: itinerary-service

      - job_name: activity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - activity-service.tripplanning.svc.cluster.local:8080
            labels:
              service: activity-service

      - job_name: booking-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - booking-service.tripplanning.svc.cluster.local:8080
            labels:
              service: booking-service
