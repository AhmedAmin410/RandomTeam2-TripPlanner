---
# ─── Prometheus ConfigMap (full 5-job scrape config) ─────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: user-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['user-service:8081']
            labels:
              service: user-service

      - job_name: destination-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['destination-service:8082']
            labels:
              service: destination-service

      - job_name: itinerary-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['itinerary-service:8083']
            labels:
              service: itinerary-service

      - job_name: activity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['activity-service:8084']
            labels:
              service: activity-service

      - job_name: booking-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['booking-service:8085']
            labels:
              service: booking-service
---
# ─── Prometheus PVC ───────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ─── Prometheus Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
# ─── Prometheus Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
